CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=8192
CONFIG_NET_TEST=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_EVENTFD=y
CONFIG_MAIN_STACK_SIZE=4096

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=y
CONFIG_NET_LOOPBACK_MTU=1280
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=8192
CONFIG_ZVFS_POLL_MAX=24
CONFIG_ZVFS_OPEN_ADD_SIZE_NET=24
CONFIG_NET_BUF_RX_COUNT=256
CONFIG_NET_BUF_TX_COUNT=256
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=12
CONFIG_NET_MAX_CONN=12
CONFIG_NET_CONTEXT_RCVTIMEO=y

# Client under test
CONFIG_HTTP_CLIENT_MULTIPROTOCOL=y
CONFIG_HTTP_CLIENT_MAX_STREAMS=4
CONFIG_HTTP_CLIENT_WORKQUEUE_STACK_SIZE=4096

# Zephyr HTTP server as the peer
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_1=n
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_VERSION_3=y
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y
CONFIG_HTTP_SERVER_CAPTURE_HEADER_COUNT=4
CONFIG_HTTP_SERVER_MAX_STREAMS=8
CONFIG_HTTP_SERVER_STACK_SIZE=8192
# Takes whole DATA frames of a request
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048

# QUIC, for both ends
CONFIG_QUIC=y
CONFIG_QUIC_MAX_CONTEXTS=4
CONFIG_QUIC_MAX_ENDPOINTS=4
CONFIG_QUIC_MAX_STREAMS_BIDI=8
CONFIG_QUIC_MAX_STREAMS_UNI=8
CONFIG_QUIC_INITIAL_MAX_STREAMS_BIDI=8
CONFIG_QUIC_INITIAL_MAX_STREAMS_UNI=8
CONFIG_QUIC_PKT_COUNT=32
# The server's HTTP/3 stream ends a response early when flow control blocks
# it at the end of the request, so the test body has to fit the window.
CONFIG_QUIC_STREAM_TX_BUFFER_SIZE=32768
CONFIG_QUIC_STREAM_RX_BUFFER_SIZE=32768
CONFIG_QUIC_INITIAL_MAX_DATA=65536

CONFIG_TLS_CREDENTIALS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=65536
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=48
CONFIG_MBEDTLS_SSL_ALPN=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=8
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=6

CONFIG_NET_LOG=y
